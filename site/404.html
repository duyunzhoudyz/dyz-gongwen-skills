<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在｜公文写作 AI Skills｜dyz-gongwen-skills</title>
<meta name="description" content="你访问的页面不存在。回到 dyz-gongwen-skills 公文写作 AI Skills 首页。">
<meta name="robots" content="noindex">
<link rel="icon" href="https://duyunzhoudyz.github.io/dyz-gongwen-skills/assets/favicon.svg" type="image/svg+xml">
<style>
  /* 404 页面可能在任意深度的路径下被返回，所以样式内联，链接用绝对地址 */
  :root {
    color-scheme: light dark;
    --ground: #f6f6f4;
    --ink: #18181a;
    --ink-soft: #4b4b51;
    --accent: #b3262d;
    --on-accent: #ffffff;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131315;
      --ink: #ececea;
      --ink-soft: #a9a9ae;
      --accent: #ef6a6f;
      --on-accent: #131315;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    align-items: center;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.85;
    letter-spacing: 0.012em;
    line-break: strict;
    overflow-x: clip;
  }
  main {
    width: 100%;
    max-width: 1000px;
    margin-inline: auto;
    padding: 48px clamp(16px, 4vw, 40px);
  }
  .code {
    margin: 0;
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(5rem, 3rem + 16vw, 12rem);
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  h1 {
    margin: 24px 0 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.875rem, 1.2rem + 2.9vw, 3rem);
    line-height: 1.3;
    text-wrap: balance;
  }
  p { margin: 16px 0 0; max-width: 32em; color: var(--ink-soft); }
  .btn {
    display: inline-flex;
    align-items: center;
    min-height: 52px;
    margin-top: 32px;
    padding: 10px 28px;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: transform 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 3px solid #1a5fd0; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true" style="margin:0">404</p>
  <h1>这一页不存在，或者已经搬走了</h1>
  <p>你可以回到公文写作 AI Skills 的首页，查看 22 个 skill 的说明和安装方式。</p>
  <a class="btn" href="https://duyunzhoudyz.github.io/dyz-gongwen-skills/">回到首页</a>
</main>
</body>
</html>
